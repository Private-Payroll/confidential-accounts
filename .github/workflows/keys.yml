name: keys

# THE ASSERTIONS THAT READ A PROVING OR VERIFIER KEY, WHICH THE CHECKS SKIP.
#
# Those keys come from the proving backend rather than an ordinary compile:
# minutes, and a hundred megabytes nothing else reads. So they are built here,
# in a workflow of their own, which runs only when a change can break one of
# the files below, every night on main, and by hand.
#
# WHEN A CHANGE CAN BREAK THEM: the paths below are every file these tests
# load or read, through their imports, the scripts that build the keys and the
# configuration that runs them, and the package versions and lockfile. A change
# that touches none of them cannot change what these tests see.
#
# No keys check may be made a required check: a run this workflow skips for a
# change outside its paths would leave a required check waiting for ever.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # the contracts, their compiled code and keys, and their tests
      - 'contracts/**'
      # the code that builds, proves and submits a call
      - 'src/**'
      - 'packages/**'
      - 'apps/wallet/**'
      - 'apps/web/**'
      # the scripts that compile the contracts, build and check the keys and fetch the parameters
      - 'scripts/compile-contract.sh'
      - 'scripts/compile-contracts.sh'
      - 'scripts/compile-vault.sh'
      - 'scripts/contract-sources.mjs'
      - 'scripts/contract-version.mjs'
      - 'scripts/fetch-proving-parameters.ts'
      - 'scripts/fetch-proving-parameters-rules.ts'
      - 'scripts/artifact-freshness.ts'
      - 'scripts/artifact-freshness.globalSetup.ts'
      - 'scripts/identity-lib-fresh.ts'
      - 'scripts/identity-lib-fresh.globalSetup.ts'
      - 'scripts/ledger-limit.ts'
      - 'scripts/ledger-limit.globalSetup.ts'
      - 'scripts/dispatch-ceiling.ts'
      - 'scripts/reconcile-vault-pool-rules.ts'
      - 'scripts/browser-graph.ts'
      - 'scripts/serve-rules.ts'
      - 'scripts/find-compactc.sh'
      # the package versions and the lockfile, and what runs the tests
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.nvmrc'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      # this workflow, and the build it shares with the checks
      - '.github/workflows/keys.yml'
      - '.github/actions/build/**'
      - '.github/checks/fetch-compiler.mjs'
      - '.github/checks/toolchain.mjs'
  schedule:
    # every night, on main
    - cron: '41 21 * * *'
  # by hand, from the Actions page
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keys-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  keys:
    # SIX NAMED GROUPS, ONE MACHINE EACH, AT ONCE. Each builds the keys for
    # itself and runs its own files; every file is in exactly one group.
    name: keys (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: account
            about: the company account's real proofs
            files: src/midnight/a-contracts-maintenance-authority-is-read-planned-and-refused.test.ts src/midnight/deferred-set.test.ts src/midnight/the-key-reaches-the-circuit.test.ts src/midnight/the-secret-comes-from-the-keyring.test.ts contracts/test/the-record-anchor-from-the-page.test.ts contracts/test/a-recovery-is-carried-out-on-the-chain.test.ts contracts/test/a-company-seats-its-signers-from-the-page.test.ts src/midnight/a-company-is-created-in-two-steps.test.ts contracts/test/a-company-born-held-from-the-browser.test.ts contracts/test/keys-on-disk.test.ts contracts/test/the-compiled-keys-are-the-keys-on-disk.test.ts contracts/test/a-company-before-its-second-step-lands.test.ts
          - group: vault
            about: the vault's real proofs
            files: src/wiring/vault-submission.test.ts contracts/test/a-company-vault-from-the-page.test.ts contracts/test/a-vaults-committee-changes-with-its-signers.test.ts contracts/test/vault-recovery.test.ts contracts/test/vault-registry.test.ts contracts/test/vault-split.test.ts contracts/test/vault-threshold-recovery.test.ts contracts/test/vault-unshielded.test.ts src/midnight/vault-coin-nonces.test.ts contracts/test/a-vault-rebuilt-with-us-gone.test.ts contracts/test/a-vaults-secret-is-replaced-by-a-signer-who-did-not-raise-it.test.ts contracts/test/the-new-vault.test.ts contracts/test/transcript.test.ts contracts/test/vault-batch-and-merge.test.ts contracts/test/vault-client.test.ts contracts/test/vault-payout.test.ts
          - group: payroll
            about: runs, private payments and spending policies, proved for real
            files: contracts/test/a-private-payment-from-the-page.test.ts contracts/test/a-spending-policy-is-set-from-a-device.test.ts contracts/test/a-run-raised-and-approved-from-the-page.test.ts contracts/test/a-run-is-raised-approved-and-paid-on-the-signers-devices.test.ts contracts/test/a-payment-needs-a-vaults-receipt.test.ts contracts/test/a-deposit-made-on-the-device.test.ts
          - group: wallet
            about: the wallet's own proofs
            files: apps/wallet/src/chain/this-builds-account-keys.test.ts apps/wallet/src/screens/approve-creation.test.tsx apps/wallet/src/chain/creation-screen-in-a-browser.test.ts apps/wallet/src/chain/the-wallet-builds-a-vault-with-its-own-keys.test.ts apps/wallet/src/actions/finish-company.test.ts apps/wallet/src/chain/the-wallet-anchors-with-its-own-keys.test.ts apps/wallet/src/chain/a-signer-invited-by-address-is-seated-from-the-wallet.test.ts apps/wallet/src/chain/a-company-account-is-read-at-one-block.test.ts apps/wallet/src/chain/account-circuits.test.ts apps/wallet/the-newest-released-version-is-this-build.test.ts
          - group: wallet-pay-key
            about: the single slowest proof, the wallet proving the pay key
            files: apps/wallet/src/chain/the-wallet-proves-the-pay-key.test.ts
          - group: device-and-service
            about: the device's and the service's proofs
            files: src/server/proving-parameters.test.ts packages/web-shared/src/a-deposit-built-on-the-device.test.ts src/server/account-creation.test.ts packages/web-shared/src/a-vault-is-read-as-it-was-born.test.ts packages/web-shared/src/the-worker-builds-an-account-only-with-this-builds-keys.test.ts packages/web-shared/src/the-device-proves-only-with-this-builds-keys.test.ts packages/web-shared/src/a-public-deposit-is-proved-on-the-device.test.ts packages/web-shared/src/vault-on-chain-here.test.ts packages/web-shared/src/vault-worker-client.test.ts
    # One proof of a full-size account circuit takes minutes on one thread.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build
      # Chromium, for the test that draws the wallet's creation screen over a deploy the
      # web application's worker built (apps/wallet/src/chain/creation-screen-in-a-browser.test.ts).
      - run: npx playwright install chromium
      - name: build the proving and verifier keys
        run: npm run compact
      # The vault is a second contract with keys of its own, which the account's
      # full build does not produce. Built after the account, because the
      # vault's generated caller reaches the account's generated module.
      - name: build the vault's proving and verifier keys
        run: npm run compact:vault -- --full
      # The real prover checks a proof against Midnight's public parameters,
      # which are not in the checkout. They are fetched and checked against the
      # digests Midnight publishes, so the deposit test proves here rather than
      # standing down.
      - name: fetch Midnight's public proving parameters
        timeout-minutes: 10
        run: npx tsx scripts/fetch-proving-parameters.ts
      - name: fetch the network's shielded circuits for this build's wallet
        run: npm run vendor-keys
      # The wallet proves the company account's calls itself, and a new vault's
      # first secret and its copies, with the account's and the vault's keys
      # copied from the builds above into its own folder and pinned there.
      - name: copy the company account's and the vault's keys into the wallet
        run: npm run vendor-keys:account
      - run: npx vitest run ${{ matrix.files }}
        env:
          KEYS_MUST_BE_BUILT: '1'
