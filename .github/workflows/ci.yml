name: check

# WHAT THIS IS FOR, IN ONE SENTENCE: a stranger with a clone and no knowledge of
# this project can tell, from this page, whether their change builds, typechecks,
# passes the tests, and is named in a way this history can carry.
#
# Nothing here needs a setting to be turned on somewhere before it can go green.
# A check that cannot pass until somebody clicks something is a check that
# blocks merges and teaches people to ignore a red mark, which costs more than
# the thing it was watching for.

on:
  push:
    branches: [main]
  # RUN THE CHECKS BY HAND, FROM THE ACTIONS PAGE.
  #
  # Everything else here is a reaction to something that happened. When a run is
  # never created at all - the Actions allowance was spent on 15 Sep 2026 and a
  # merge landed with no checks against it - there is nothing to re-run and no
  # way to ask for one, because a workflow with no manual trigger can only be
  # started by a push, and `main` moves by squash merge alone. That left a
  # commit on `main` whose marks could not be filled in by any means.
  #
  # It takes no input: the run is about the commit it is started from, and a
  # trigger that accepted arguments would be a second way to decide what gets
  # checked.
  workflow_dispatch:
  # `edited` is not one of the default activity types, and without it a title or
  # a body changed on the page after the checks went green is merged on the
  # strength of a run that never read it.
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # CANCELLED ON A PULL REQUEST AND NEVER ON THE DEFAULT BRANCH. Pushing twice
  # to a branch under review should stop the first run: nobody is reading it any
  # more. Pushing twice to the default branch and cancelling the first leaves a
  # commit that is permanently there with no completed check against it, and
  # this history is the point.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ONE JOB PER THING SOMEBODY WOULD LOOK FOR, AND THAT IS THE WHOLE LAYOUT.
  #
  # A typecheck run as a step inside a build job is a typecheck nobody can see
  # ran: the page shows one mark, and reading which half of it failed means
  # opening a log. Separate jobs cost a repeated setup and buy a page that
  # answers the question by itself.

  compile:
    name: compile
    runs-on: ubuntu-latest
    # A CEILING ON EVERY JOB. Without one a hung step runs for six hours, on
    # every machine in the matrix, and the first anybody knows is the bill.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        # A CHANGE FROM OUTSIDE BRINGS ITS OWN FILES, AND SOME OF THEM RUN HERE.
        # Nothing in this workflow pushes anything, so the token this action
        # would otherwise leave in the working copy has no use except to
        # something that should not have it.
        with:
          persist-credentials: false
      - uses: ./.github/actions/build

  typecheck:
    # FOUR CONFIGURATIONS, FOUR MARKS. They cover different trees with different
    # settings, and running them as one step means the first refusal hides the
    # other three.
    name: typecheck (${{ matrix.what }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - what: scripts
            run: npm run typecheck:scripts
          - what: source
            run: npm run typecheck
          - what: library
            run: npm run typecheck:identity
          - what: wallet
            run: npm run typecheck:wallet
    steps:
      - uses: actions/checkout@v7
        # A CHANGE FROM OUTSIDE BRINGS ITS OWN FILES, AND SOME OF THEM RUN HERE.
        # Nothing in this workflow pushes anything, so the token this action
        # would otherwise leave in the working copy has no use except to
        # something that should not have it.
        with:
          persist-credentials: false
      - uses: ./.github/actions/build
      - run: ${{ matrix.run }}

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        # A CHANGE FROM OUTSIDE BRINGS ITS OWN FILES, AND SOME OF THEM RUN HERE.
        # Nothing in this workflow pushes anything, so the token this action
        # would otherwise leave in the working copy has no use except to
        # something that should not have it.
        with:
          persist-credentials: false
      - uses: ./.github/actions/build
      # THE REFUSAL PATH FIRST, WHILE THE MAP IS STILL ABSENT.
      #
      # The query below reads a module map. The one answer it must never give is
      # *nothing depends on it* for a name that is not there, and the assertion
      # holding that runs only where no map is on disk - so deriving the map and
      # then running the suite would stand it down as surely as a fresh checkout
      # does. It is the cheaper half to lose and the worse half to lose quietly,
      # so it runs here, in the one moment of this job when there is no map.
      - name: the module map query refuses before there is a map to query
        run: npx vitest run scripts/what-breaks.test.ts
      # THEN THE MAP IS DERIVED, BEFORE THE SUITE READS IT.
      #
      # 10 assertions read that map instead of building their own picture of
      # the graph, and they stand down when it is not on disk - which in a fresh
      # checkout is always. Without this step the suite passes with ten fewer
      # assertions than it collects, and says so nowhere.
      #
      # An eleventh stands down on the publication allowlist and this step does
      # not reach it: that file names the files that are not published, so it
      # cannot be published, and the assertion reading it - the instrument for a
      # published file swallowed by an ignore rule - runs only where that list
      # already is. That gap is recorded rather than closed.
      #
      # This writes the map and no document. The command that writes everything
      # generated would also rewrite the design documents, and rewriting them
      # immediately before the step that compares them against the source is a
      # comparison that can no longer refuse anything.
      - name: derive the module map the suite reads
        run: npx tsx scripts/edge-list-run.ts
      # The runner rather than the manifest's `test` script, which compiles and
      # typechecks first. Both have already happened above, as marks of their
      # own, and doing them again here would hide them behind this one.
      - run: npx vitest run

  keys:
    # THE ASSERTIONS THAT READ A VERIFIER KEY, WHICH THE JOB ABOVE SKIPS.
    #
    # Those keys are produced by the proving backend rather than by an ordinary
    # compile: about a minute, and a hundred megabytes that nothing else here
    # reads. Building them in every job above would put that on six machines to
    # serve a handful of files, so it happens once, here, for both contracts,
    # and those files are the only thing this runs.
    #
    # It is a mark of its own so that "the keys were not built" and "the keys
    # disagree with the contract" are different lines on the page. What it
    # covers is the check that a deployed entry point still carries the key this
    # build produces, which is the one an operator cannot make for themselves.
    name: keys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/build
      - name: build the proving and verifier keys
        run: npm run compact
      # The vault is a second contract with keys of its own, which the account's
      # full build does not produce. Built after the account, because the
      # vault's generated caller reaches the account's generated module.
      - name: build the vault's proving and verifier keys
        run: npm run compact:vault -- --full
      - run: npx vitest run src/midnight/ledger.test.ts src/midnight/deferred-set.test.ts src/midnight/the-key-reaches-the-circuit.test.ts src/midnight/the-secret-comes-from-the-keyring.test.ts src/wiring/vault-submission.test.ts contracts/test/a-company-vault-from-the-page.test.ts contracts/test/a-private-payment-from-the-page.test.ts contracts/test/a-run-raised-and-approved-from-the-page.test.ts

  rules:
    # THE RULES THE JOB BELOW APPLIES, CHECKED BEFORE IT APPLIES THEM.
    #
    # They are pure functions with no dependencies, so this needs nothing
    # installed and finishes in about a second. It runs on a push as well as on
    # a pull request, because a rule that stopped refusing passes every case
    # that was ever written to show it working.
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        # A CHANGE FROM OUTSIDE BRINGS ITS OWN FILES, AND SOME OF THEM RUN HERE.
        # Nothing in this workflow pushes anything, so the token this action
        # would otherwise leave in the working copy has no use except to
        # something that should not have it.
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:checks

  message:
    # A SQUASHED MERGE MAKES THE TITLE THE SUBJECT AND THE BODY THE BODY, so
    # both are read here as the message they are about to become. The branch
    # name is read too: it stays on this page after the branch is gone, and no
    # later change reaches it.
    #
    # What this cannot do, said plainly because it is the gap: some of what must
    # never reach a public history can only be recognised from a list, and a
    # check that carried that list would publish it. That half runs where the
    # list is, before a commit is made. What runs here is the half that names
    # nothing: shapes, lengths and characters.
    name: message
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        # A CHANGE FROM OUTSIDE BRINGS ITS OWN FILES, AND SOME OF THEM RUN HERE.
        # Nothing in this workflow pushes anything, so the token this action
        # would otherwise leave in the working copy has no use except to
        # something that should not have it.
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Written through the environment rather than into the command line, so
      # nothing a title says can become part of the command that reads it.
      #
      # The number is appended because that is what a squashed merge writes: the
      # subject that reaches the history is the title plus " (#N)", and a title
      # read without it passes at a length the commit will not have.
      - name: read the title and the body as the message they will become
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: printf '%s (#%s)\n\n%s\n' "$TITLE" "$NUMBER" "$BODY" > "$RUNNER_TEMP/message"
      - name: hold the message and the branch to what this history can carry
        env:
          BRANCH: ${{ github.head_ref }}
        run: node .github/checks/message-check.mjs "$RUNNER_TEMP/message" --branch "$BRANCH"
