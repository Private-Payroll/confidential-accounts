name: Something should be different
description: A change to how this works, or something it should do and does not.
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: >-
        **Read `README.md` first.** The architecture here is the way it is on
        purpose, and the most useful proposal is usually one that names the
        property it would change and says what has changed since that property
        was chosen.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >-
        What is hard or impossible today. Describe the situation, not the
        solution — a proposal that starts from the fix hides whether there is a
        better one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: What should be different, and what a person would do afterwards that they cannot do now.
    validations:
      required: true
  - type: textarea
    id: property
    attributes:
      label: Which stated property of the system this touches, if any
      description: >-
        A claim in `README.md` or `SECURITY.md`, or "none that I found". Saying
        none is a fine answer and is itself useful.
  - type: textarea
    id: cost
    attributes:
      label: What it would cost
      description: >-
        What else would have to change, what would get slower, and what could be
        lost. A proposal with an honest cost in it is read first.
